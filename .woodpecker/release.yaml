# Harbor components — build, push, scan, and sign GHCR images.
# Triggered by isityael v2.16.0 yael tag (v2.16.0-yael.1).
#
# Images pushed to ghcr.io/isityael only:
#   nginx-photon, harbor-portal, harbor-core, harbor-jobservice,
#   registry-photon, harbor-registryctl, harbor-db,
#   harbor-trivy-adapter, harbor-exporter, valkey-photon
#
# Required secrets:
#   github_username, github_token   — GHCR auth (GitHub PAT with packages:write)
#   cosign_key, cosign_password     — cosign signing
#   notation_key, notation_cert     — notation signing
when:
  - event: tag
    ref: "refs/tags/v2.16.0-yael.*"

clone:
  git:
    image: woodpeckerci/plugin-git
    settings:
      lfs: false
      tags: false

# Mount the pipeline PVC at its working directory. This avoids a non-root
# permission-init container having to create /woodpecker/src on NFS.
workspace:
  base: /woodpecker
  path: /

# The ten images are independent. They build three at a time (the three
# slowest first), because every pod of a workflow is pinned to one worker and
# each buildx pod may use up to 4Gi. Serial builds took 22-36 min.
steps:
  - name: validate-version
    depends_on: []
    image: "dhi.io/busybox:1.37.0-debian13"
    commands:
      - test -n "$CI_COMMIT_TAG"
      - |
        case "$CI_COMMIT_TAG" in
          v2.16.0-yael.*) ;;
          *) echo "Refusing to release tag outside the v2.16.0-yael series: $CI_COMMIT_TAG"; exit 1 ;;
        esac

  - name: build-nginx
    depends_on: [build-registryctl, build-exporter, build-registry]
    image: woodpeckerci/plugin-docker-buildx:6.1.2@sha256:d26b69cbe748b8a219c707e7889d5ffb3f9214bc3c480c30fe857ff85954267c
    privileged: true
    settings:
      registry: ghcr.io
      repo: ghcr.io/isityael/nginx-photon
      dockerfile: build/docker/Dockerfile.nginx
      context: .
      tags: ["candidate-${CI_COMMIT_TAG}"]
      cache_from: 'type=registry\,ref=ghcr.io/isityael/nginx-photon:buildcache'
      cache_to: 'type=registry,ref=ghcr.io/isityael/nginx-photon:buildcache,mode=max,ignore-error=true'
      platforms: linux/amd64
      logins:
        - registry: ghcr.io
          username:
            from_secret: github_username
          password:
            from_secret: github_token
        - registry: dhi.io
          username:
            from_secret: dhi_username
          password:
            from_secret: dhi_password
      provenance: "mode=max"
      buildkit_driveropt: "network=host"

  - name: build-portal
    depends_on: [validate-version]
    image: woodpeckerci/plugin-docker-buildx:6.1.2@sha256:d26b69cbe748b8a219c707e7889d5ffb3f9214bc3c480c30fe857ff85954267c
    privileged: true
    settings:
      registry: ghcr.io
      repo: ghcr.io/isityael/harbor-portal
      dockerfile: build/docker/Dockerfile.portal
      context: .
      tags: ["candidate-${CI_COMMIT_TAG}"]
      cache_from: 'type=registry\,ref=ghcr.io/isityael/harbor-portal:buildcache'
      cache_to: 'type=registry,ref=ghcr.io/isityael/harbor-portal:buildcache,mode=max,ignore-error=true'
      platforms: linux/amd64
      logins:
        - registry: ghcr.io
          username:
            from_secret: github_username
          password:
            from_secret: github_token
        - registry: dhi.io
          username:
            from_secret: dhi_username
          password:
            from_secret: dhi_password
      provenance: "mode=max"
      buildkit_driveropt: "network=host"

  - name: build-core
    depends_on: [validate-version]
    image: woodpeckerci/plugin-docker-buildx:6.1.2@sha256:d26b69cbe748b8a219c707e7889d5ffb3f9214bc3c480c30fe857ff85954267c
    privileged: true
    settings:
      registry: ghcr.io
      repo: ghcr.io/isityael/harbor-core
      dockerfile: build/docker/Dockerfile.core
      context: .
      tags: ["candidate-${CI_COMMIT_TAG}"]
      cache_from: 'type=registry\,ref=ghcr.io/isityael/harbor-core:buildcache'
      cache_to: 'type=registry,ref=ghcr.io/isityael/harbor-core:buildcache,mode=max,ignore-error=true'
      platforms: linux/amd64
      logins:
        - registry: ghcr.io
          username:
            from_secret: github_username
          password:
            from_secret: github_token
        - registry: dhi.io
          username:
            from_secret: dhi_username
          password:
            from_secret: dhi_password
      build_args:
        - "GITCOMMIT=${CI_COMMIT_SHA:0:8}"
        - "RELEASE_VERSION=${CI_COMMIT_TAG}"
      provenance: "mode=max"
      buildkit_driveropt: "network=host"

  - name: build-jobservice
    depends_on: [validate-version]
    image: woodpeckerci/plugin-docker-buildx:6.1.2@sha256:d26b69cbe748b8a219c707e7889d5ffb3f9214bc3c480c30fe857ff85954267c
    privileged: true
    settings:
      registry: ghcr.io
      repo: ghcr.io/isityael/harbor-jobservice
      dockerfile: build/docker/Dockerfile.jobservice
      context: .
      tags: ["candidate-${CI_COMMIT_TAG}"]
      cache_from: 'type=registry\,ref=ghcr.io/isityael/harbor-jobservice:buildcache'
      cache_to: 'type=registry,ref=ghcr.io/isityael/harbor-jobservice:buildcache,mode=max,ignore-error=true'
      platforms: linux/amd64
      logins:
        - registry: ghcr.io
          username:
            from_secret: github_username
          password:
            from_secret: github_token
        - registry: dhi.io
          username:
            from_secret: dhi_username
          password:
            from_secret: dhi_password
      build_args:
        - "GITCOMMIT=${CI_COMMIT_SHA:0:8}"
        - "RELEASE_VERSION=${CI_COMMIT_TAG}"
      provenance: "mode=max"
      buildkit_driveropt: "network=host"

  - name: build-registry
    depends_on: [build-portal, build-core, build-jobservice]
    image: woodpeckerci/plugin-docker-buildx:6.1.2@sha256:d26b69cbe748b8a219c707e7889d5ffb3f9214bc3c480c30fe857ff85954267c
    privileged: true
    settings:
      registry: ghcr.io
      repo: ghcr.io/isityael/registry-photon
      dockerfile: build/docker/Dockerfile.registry
      context: .
      tags: ["candidate-${CI_COMMIT_TAG}"]
      cache_from: 'type=registry\,ref=ghcr.io/isityael/registry-photon:buildcache'
      cache_to: 'type=registry,ref=ghcr.io/isityael/registry-photon:buildcache,mode=max,ignore-error=true'
      platforms: linux/amd64
      logins:
        - registry: ghcr.io
          username:
            from_secret: github_username
          password:
            from_secret: github_token
        - registry: dhi.io
          username:
            from_secret: dhi_username
          password:
            from_secret: dhi_password
      provenance: "mode=max"
      buildkit_driveropt: "network=host"

  - name: build-registryctl
    depends_on: [build-portal, build-core, build-jobservice]
    image: woodpeckerci/plugin-docker-buildx:6.1.2@sha256:d26b69cbe748b8a219c707e7889d5ffb3f9214bc3c480c30fe857ff85954267c
    privileged: true
    settings:
      registry: ghcr.io
      repo: ghcr.io/isityael/harbor-registryctl
      dockerfile: build/docker/Dockerfile.registryctl
      context: .
      tags: ["candidate-${CI_COMMIT_TAG}"]
      cache_from: 'type=registry\,ref=ghcr.io/isityael/harbor-registryctl:buildcache'
      cache_to: 'type=registry,ref=ghcr.io/isityael/harbor-registryctl:buildcache,mode=max,ignore-error=true'
      platforms: linux/amd64
      logins:
        - registry: ghcr.io
          username:
            from_secret: github_username
          password:
            from_secret: github_token
        - registry: dhi.io
          username:
            from_secret: dhi_username
          password:
            from_secret: dhi_password
      build_args:
        - "GITCOMMIT=${CI_COMMIT_SHA:0:8}"
        - "RELEASE_VERSION=${CI_COMMIT_TAG}"
      provenance: "mode=max"
      buildkit_driveropt: "network=host"

  - name: build-db
    depends_on: [build-registryctl, build-exporter, build-registry]
    image: woodpeckerci/plugin-docker-buildx:6.1.2@sha256:d26b69cbe748b8a219c707e7889d5ffb3f9214bc3c480c30fe857ff85954267c
    privileged: true
    settings:
      registry: ghcr.io
      repo: ghcr.io/isityael/harbor-db
      dockerfile: build/docker/Dockerfile.db
      context: .
      tags: ["candidate-${CI_COMMIT_TAG}"]
      cache_from: 'type=registry\,ref=ghcr.io/isityael/harbor-db:buildcache'
      cache_to: 'type=registry,ref=ghcr.io/isityael/harbor-db:buildcache,mode=max,ignore-error=true'
      platforms: linux/amd64
      logins:
        - registry: ghcr.io
          username:
            from_secret: github_username
          password:
            from_secret: github_token
        - registry: dhi.io
          username:
            from_secret: dhi_username
          password:
            from_secret: dhi_password
      provenance: "mode=max"
      buildkit_driveropt: "network=host"

  - name: build-trivy-adapter
    depends_on: [build-registryctl, build-exporter, build-registry]
    image: woodpeckerci/plugin-docker-buildx:6.1.2@sha256:d26b69cbe748b8a219c707e7889d5ffb3f9214bc3c480c30fe857ff85954267c
    privileged: true
    settings:
      registry: ghcr.io
      repo: ghcr.io/isityael/harbor-trivy-adapter
      dockerfile: build/docker/Dockerfile.trivy-adapter
      context: .
      tags: ["candidate-${CI_COMMIT_TAG}"]
      cache_from: 'type=registry\,ref=ghcr.io/isityael/harbor-trivy-adapter:buildcache'
      cache_to: 'type=registry,ref=ghcr.io/isityael/harbor-trivy-adapter:buildcache,mode=max,ignore-error=true'
      platforms: linux/amd64
      logins:
        - registry: ghcr.io
          username:
            from_secret: github_username
          password:
            from_secret: github_token
        - registry: dhi.io
          username:
            from_secret: dhi_username
          password:
            from_secret: dhi_password
      provenance: "mode=max"
      buildkit_driveropt: "network=host"

  - name: build-exporter
    depends_on: [build-portal, build-core, build-jobservice]
    image: woodpeckerci/plugin-docker-buildx:6.1.2@sha256:d26b69cbe748b8a219c707e7889d5ffb3f9214bc3c480c30fe857ff85954267c
    privileged: true
    settings:
      registry: ghcr.io
      repo: ghcr.io/isityael/harbor-exporter
      dockerfile: build/docker/Dockerfile.exporter
      context: .
      tags: ["candidate-${CI_COMMIT_TAG}"]
      cache_from: 'type=registry\,ref=ghcr.io/isityael/harbor-exporter:buildcache'
      cache_to: 'type=registry,ref=ghcr.io/isityael/harbor-exporter:buildcache,mode=max,ignore-error=true'
      platforms: linux/amd64
      logins:
        - registry: ghcr.io
          username:
            from_secret: github_username
          password:
            from_secret: github_token
        - registry: dhi.io
          username:
            from_secret: dhi_username
          password:
            from_secret: dhi_password
      build_args:
        - "GITCOMMIT=${CI_COMMIT_SHA:0:8}"
        - "RELEASE_VERSION=${CI_COMMIT_TAG}"
      provenance: "mode=max"
      buildkit_driveropt: "network=host"

  - name: build-valkey
    depends_on: [build-registryctl, build-exporter, build-registry]
    image: woodpeckerci/plugin-docker-buildx:6.1.2@sha256:d26b69cbe748b8a219c707e7889d5ffb3f9214bc3c480c30fe857ff85954267c
    privileged: true
    settings:
      registry: ghcr.io
      repo: ghcr.io/isityael/valkey-photon
      dockerfile: build/docker/Dockerfile.valkey
      context: .
      tags: ["candidate-${CI_COMMIT_TAG}"]
      cache_from: 'type=registry\,ref=ghcr.io/isityael/valkey-photon:buildcache'
      cache_to: 'type=registry,ref=ghcr.io/isityael/valkey-photon:buildcache,mode=max,ignore-error=true'
      platforms: linux/amd64
      logins:
        - registry: ghcr.io
          username:
            from_secret: github_username
          password:
            from_secret: github_token
        - registry: dhi.io
          username:
            from_secret: dhi_username
          password:
            from_secret: dhi_password
      provenance: "mode=max"
      buildkit_driveropt: "network=host"

  - name: trivy-scan
    depends_on: [build-portal, build-core, build-jobservice, build-registryctl, build-exporter, build-registry, build-trivy-adapter, build-db, build-valkey, build-nginx]
    image: "aquasec/trivy:0.74.0@sha256:62b1e65e8869bc4b4c6aa4fa2b21595256c7c2f6018a9d9ad61caf87187c1969"
    environment:
      TRIVY_USERNAME:
        from_secret: github_username
      TRIVY_PASSWORD:
        from_secret: github_token
    commands:
      - |
        # Scan every image before failing so one release run reports all
        # CRITICAL findings, not just the first image that has one.
        failed=""
        for image in nginx-photon harbor-portal harbor-core harbor-jobservice registry-photon harbor-registryctl harbor-db harbor-trivy-adapter harbor-exporter valkey-photon; do
          ref="ghcr.io/isityael/$${image}:candidate-${CI_COMMIT_TAG}"
          trivy image --scanners vuln --skip-version-check --exit-code 1 --severity CRITICAL --ignore-unfixed "$${ref}" || failed="$${failed} $${image}"
          trivy image --scanners vuln --skip-version-check --exit-code 0 --severity HIGH --ignore-unfixed "$${ref}"
        done
        if [ -n "$${failed}" ]; then
          echo "CRITICAL vulnerabilities in:$${failed}" >&2
          exit 1
        fi

  - name: promote-ghcr
    depends_on: [trivy-scan]
    image: "dhi.io/crane:0.21.7-debian13-dev@sha256:9e10a9ed1d204f70873bd656d9d823f63ff0e9d138261fa34d85155499e1d982"
    environment:
      REGISTRY_USERNAME:
        from_secret: github_username
      REGISTRY_PASSWORD:
        from_secret: github_token
    commands:
      - crane auth login ghcr.io -u "$${REGISTRY_USERNAME}" -p "$${REGISTRY_PASSWORD}"
      - |
        for image in nginx-photon harbor-portal harbor-core harbor-jobservice registry-photon harbor-registryctl harbor-db harbor-trivy-adapter harbor-exporter valkey-photon; do
          candidate="ghcr.io/isityael/$${image}:candidate-${CI_COMMIT_TAG}"
          crane cp "$${candidate}" "ghcr.io/isityael/$${image}:${CI_COMMIT_TAG}"
          crane cp "$${candidate}" "ghcr.io/isityael/$${image}:latest"
        done

  - name: cosign-sign
    depends_on: [promote-ghcr]
    image: "dhi.io/cosign:3.0.5-debian13-dev"
    environment:
      COSIGN_EXPERIMENTAL: "1"
      COSIGN_KEY:
        from_secret: cosign_key
      COSIGN_PASSWORD:
        from_secret: cosign_password
      REGISTRY_USERNAME:
        from_secret: github_username
      REGISTRY_PASSWORD:
        from_secret: github_token
    commands:
      - echo "$COSIGN_KEY" > /tmp/cosign.key
      - cosign login ghcr.io -u "$REGISTRY_USERNAME" -p "$REGISTRY_PASSWORD"
      - |
        for image in nginx-photon harbor-portal harbor-core harbor-jobservice registry-photon harbor-registryctl harbor-db harbor-trivy-adapter harbor-exporter valkey-photon; do
          cosign sign --key /tmp/cosign.key --yes --registry-referrers-mode=oci-1-1 "ghcr.io/isityael/$${image}:${CI_COMMIT_TAG}"
        done
      - rm -f /tmp/cosign.key

  - name: notation-sign
    depends_on: [cosign-sign]
    image: "dhi.io/notation:1.3.2-debian13-dev"
    environment:
      NOTATION_KEY:
        from_secret: notation_key
      NOTATION_CERT:
        from_secret: notation_cert
      REGISTRY_USERNAME:
        from_secret: github_username
      REGISTRY_PASSWORD:
        from_secret: github_token
    commands:
      - mkdir -p /tmp/notation $HOME/.config/notation $HOME/.docker
      - echo "$NOTATION_KEY" > /tmp/notation/harbor.key
      - echo "$NOTATION_CERT" > /tmp/notation/harbor.crt
      - |
        cat > $HOME/.config/notation/signingkeys.json <<EOF
        {"default":"harbor","keys":[{"name":"harbor","keyPath":"/tmp/notation/harbor.key","certPath":"/tmp/notation/harbor.crt"}]}
        EOF
      - printf '{"auths":{"ghcr.io":{"auth":"%s"}}}' "$(printf '%s:%s' "$REGISTRY_USERNAME" "$REGISTRY_PASSWORD" | base64 -w0)" > $HOME/.docker/config.json
      - |
        for image in nginx-photon harbor-portal harbor-core harbor-jobservice registry-photon harbor-registryctl harbor-db harbor-trivy-adapter harbor-exporter valkey-photon; do
          notation sign --force-referrers-tag=false --key harbor "ghcr.io/isityael/$${image}:${CI_COMMIT_TAG}"
        done
      - rm -rf /tmp/notation $HOME/.docker/config.json
