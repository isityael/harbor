# Harbor Go components — build verification pipeline
# Runs on push/PR to the progressed branch
#
# Verifies the 4 Go components compile successfully. Full go vet is not
# possible without swagger-generated code (server/v2.0/{models,restapi})
# which requires `make gen_apis` and isn't checked in.
#
# Go dependencies are restored from Garage S3 into this pipeline's workspace.
when:
  - event: [push, pull_request]
    branch: progressed

clone:
  git:
    image: woodpeckerci/plugin-git
    settings:
      lfs: false
      recursive: false
      tags: false

steps:
  - name: restore-go-cache
    image: plugins/cache:1.10@sha256:6a5cf9cf3813e9b5a554f56dbc9c073cb24463b7bddd5b10e25790d732e68938
    failure: ignore
    settings:
      access_key: {from_secret: garage_s3_access_key}
      secret_key: {from_secret: garage_s3_secret_key}
      restore: true
      backend: s3
      endpoint: http://garage.garage.svc.cluster.local:3900
      bucket: buildkit-cache
      region: garage
      path_style: true
      archive_format: zstd
      cache_key: 'woodpecker/harbor/go/amd64/go1.26-{{ checksum "src/go.sum" }}'
      mount: [.cache/harbor]

  - name: generate-swagger
    image: dhi.io/golang:1.26.5-debian13-dev@sha256:c15c327d115e8af76f50fb5dc9da2d81280527ff6da30b5eb423499eb42c5897
    environment:
      GOMODCACHE: ${CI_WORKSPACE}/.cache/harbor/go-mod
      GOCACHE: ${CI_WORKSPACE}/.cache/harbor/go-build
      GOBIN: ${CI_WORKSPACE}/.cache/harbor/bin
      SWAGGER_BIN: ${CI_WORKSPACE}/.cache/harbor/bin/swagger-v0.33.1
    commands:
      - mkdir -p "$GOMODCACHE" "$GOCACHE" "$GOBIN"
      - |
        if [ ! -x "$SWAGGER_BIN" ]; then
          go install github.com/go-swagger/go-swagger/cmd/swagger@v0.33.1
          mv "$GOBIN/swagger" "$SWAGGER_BIN"
        fi
      - timeout 10m "$SWAGGER_BIN" generate server
        --template-dir=tools/swagger/templates
        --exclude-main
        --additional-initialism=CVE
        --additional-initialism=GC
        --additional-initialism=OIDC
        -f api/v2.0/swagger.yaml
        -A harbor
        --target src/server/v2.0

  - name: build-check
    image: dhi.io/golang:1.26.5-debian13-dev@sha256:c15c327d115e8af76f50fb5dc9da2d81280527ff6da30b5eb423499eb42c5897
    environment:
      GOMODCACHE: ${CI_WORKSPACE}/.cache/harbor/go-mod
      GOCACHE: ${CI_WORKSPACE}/.cache/harbor/go-build
    commands:
      - mkdir -p "$GOMODCACHE" "$GOCACHE"
      - cd src
      - go mod verify
      - echo "Building core..."
      - CGO_ENABLED=0 go build -o /dev/null ./core
      - echo "Building jobservice..."
      - CGO_ENABLED=0 go build -o /dev/null ./jobservice
      - echo "Building registryctl..."
      - CGO_ENABLED=0 go build -o /dev/null ./registryctl
      - echo "Building exporter..."
      - CGO_ENABLED=0 go build -o /dev/null ./cmd/exporter
      - echo "All 4 components compile successfully."

  - name: rebuild-go-cache
    image: plugins/cache:1.10@sha256:6a5cf9cf3813e9b5a554f56dbc9c073cb24463b7bddd5b10e25790d732e68938
    failure: ignore
    when:
      - event: push
        branch: progressed
    settings:
      access_key: {from_secret: garage_s3_access_key}
      secret_key: {from_secret: garage_s3_secret_key}
      rebuild: true
      backend: s3
      endpoint: http://garage.garage.svc.cluster.local:3900
      bucket: buildkit-cache
      region: garage
      path_style: true
      archive_format: zstd
      cache_key: 'woodpecker/harbor/go/amd64/go1.26-{{ checksum "src/go.sum" }}'
      mount: [.cache/harbor]
