name: Create Harbor fork release tag

on:
  push:
    branches: [progressed]
    paths:
      - go.mod
      - go.sum
      - src/**
      - make/**
      - build/**
      - VERSION
      - .woodpecker/release.yaml
      - .forgejo/workflows/release-tag.yaml
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out complete history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Create immutable release tag
        env:
          FORGEJO_API_URL: ${{ github.server_url }}/api/v1
          FORGEJO_REPOSITORY: ${{ github.repository }}
          FORGEJO_TOKEN: ${{ github.token }}
        run: |
          set -eu
          ./hack/wait-for-woodpecker-success.sh "${GITHUB_SHA}" ci/woodpecker/push/lint
          series="$(sed -n 's/^\(v[0-9][0-9.]*-yael\)\.[0-9][0-9]*$/\1/p' VERSION)"
          test -n "${series}"
          max=0
          for tag in $(git tag --list "${series}.*"); do
            revision="${tag#"${series}."}"
            case "${revision}" in
              *[!0-9]*|'') continue ;;
            esac
            [ "${revision}" -le "${max}" ] || max="${revision}"
            if [ "$(git rev-list -n 1 "${tag}")" = "${GITHUB_SHA}" ]; then
              echo "${tag} already releases ${GITHUB_SHA}"
              exit 0
            fi
          done
          tag="${series}.$((max + 1))"
          curl --fail --silent --show-error \
            --request POST \
            --header "Authorization: token ${FORGEJO_TOKEN}" \
            --header 'Content-Type: application/json' \
            --data "{\"tag_name\":\"${tag}\",\"target\":\"${GITHUB_SHA}\"}" \
            "${FORGEJO_API_URL}/repos/${FORGEJO_REPOSITORY}/tags"
